name: Release on Merge

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Test CLI
        working-directory: cli
        run: |
          npm ci || npm install
          npm run build
          npm test

      - name: Verify Patches Against Upstream
        run: |
          ./build/fetch-base.sh
          ./build/apply-patches.sh

      - name: Determine Version Tag
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v0.1.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG_NAME}"

      - name: Install & Test Companion Extension
        working-directory: extensions/veritty
        run: |
          npm ci || npm install
          npm run build

      - name: Package Release Assets
        run: |
          mkdir -p dist-assets

          TAG="${{ steps.versioning.outputs.tag_name }}"

          # 1. Package CLI bundle (executable node runner + shell hooks)
          CLI_STAGE_DIR="veritty-cli-${TAG}"
          mkdir -p "${CLI_STAGE_DIR}/bin" "${CLI_STAGE_DIR}/dist" "${CLI_STAGE_DIR}/shell"
          cp -r cli/dist/* "${CLI_STAGE_DIR}/dist/"
          cp -r shell/* "${CLI_STAGE_DIR}/shell/"
          cp LICENSE README.md "${CLI_STAGE_DIR}/"
          printf '#!/usr/bin/env bash\nTARGET="${BASH_SOURCE[0]}"\nwhile [ -h "$TARGET" ]; do\n  DIR="$(cd -P "$(dirname "$TARGET")" && pwd)"\n  TARGET="$(readlink "$TARGET")"\n  [[ $TARGET != /* ]] && TARGET="$DIR/$TARGET"\ndone\nSCRIPT_DIR="$(cd -P "$(dirname "$TARGET")/.." && pwd)"\nexec node "${SCRIPT_DIR}/dist/index.js" "$@"\n' > "${CLI_STAGE_DIR}/bin/veritty"
          chmod +x "${CLI_STAGE_DIR}/bin/veritty"
          tar -czf "dist-assets/veritty-cli-${TAG}.tar.gz" "$CLI_STAGE_DIR"

          # 2. Package Patches bundle
          tar -czf "dist-assets/veritty-patches-${TAG}.tar.gz" patches/ build/

          # 3. Package Companion Extension bundle
          tar -czf "dist-assets/veritty-companion-${TAG}.tar.gz" extensions/

          ls -la dist-assets/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.versioning.outputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes || true
          fi

          gh release create "$TAG_NAME" \
            dist-assets/* \
            --title "VeriTTY ${TAG_NAME}" \
            --generate-notes \
            --latest
